[project]
name = "remoteconnect-mcp"
version = "0.20.0rc2"
description = "MCP server for Schneider Electric RemoteConnect and SCADAPack x70 logic projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anyio>=4.5,<5",
    "mcp>=1.30.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "pymodbus>=3.10,<4",
    "lxml>=5.0",
    "xlrd>=2.0,<3",
    "xlutils>=2.0,<3",
]

[project.scripts]
remoteconnect-mcp = "remoteconnect_mcp.server:main"

[dependency-groups]
build = ["pyinstaller==6.22.3; sys_platform == 'win32'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remoteconnect_mcp = ["native/*.cs"]
